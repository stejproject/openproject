<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dark Minimalist Realtime Chat</title>
    <style>
        :root {
            --bg-main: #121214;
            --bg-sidebar: #1a1a1e;
            --bg-chat: #151518;
            --bg-bubble-out: #2f62de;
            --bg-bubble-in: #222226;
            --text-main: #f5f5f7;
            --text-muted: #8e8e93;
            --border-color: #26262b;
            --accent: #2f62de;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0b0b0c;
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .chat-container {
            display: flex;
            width: 95vw;
            max-width: 1100px;
            height: 90vh;
            background-color: var(--bg-main);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
        }

        .sidebar {
            width: 30%;
            background-color: var(--bg-sidebar);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 20px;
        }

        .profile-section {
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .profile-section input {
            background-color: #121214;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 8px 12px;
            border-radius: 6px;
            outline: none;
            font-size: 13px;
        }

        .info-text {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 15px;
            line-height: 1.4;
        }

        .chat-area {
            width: 70%;
            background-color: var(--bg-chat);
            display: flex;
            flex-direction: column;
        }

        .chat-header {
            padding: 15px 20px;
            border-bottom: 1px solid var(--border-color);
            background-color: var(--bg-main);
        }

        .chat-header h3 { font-size: 16px; font-weight: 600; }
        .chat-header p { font-size: 12px; color: var(--text-muted); }

        .message-area {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message { display: flex; flex-direction: column; max-width: 75%; position: relative; }
        .message .sender-name { font-size: 11px; color: var(--text-muted); margin-bottom: 4px; margin-left: 4px; }
        .message .bubble { padding: 10px 14px; border-radius: 14px; font-size: 14px; line-height: 1.5; }
        .message .time { font-size: 10px; color: var(--text-muted); margin-top: 4px; align-self: flex-end; }

        .incoming { align-self: flex-start; }
        .incoming .bubble { background-color: var(--bg-bubble-in); color: var(--text-main); border-top-left-radius: 4px; }

        .outgoing { align-self: flex-end; }
        .outgoing .bubble { background-color: var(--bg-bubble-out); color: #ffffff; border-top-right-radius: 4px; }

        .chat-input-container { padding: 15px 20px; background-color: var(--bg-main); border-top: 1px solid var(--border-color); }
        .chat-input-container form { display: flex; gap: 12px; }
        .chat-input-container input {
            flex: 1;
            background-color: #1a1a1e;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 12px 16px;
            border-radius: 8px;
            outline: none;
            font-size: 14px;
        }
        .chat-input-container button {
            background-color: var(--accent);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 0 20px;
            font-weight: 600;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <aside class="sidebar">
            <div class="profile-section">
                <label style="font-size: 12px; color: var(--text-muted);">Nama Anda:</label>
                <input type="text" id="namaInput" value="Pengguna Baru" autocomplete="off">
            </div>
            <div class="info-text">
                Ketik pesan di bawah dan klik kirim. Buka file ini di tab atau perangkat berbeda dengan nama berbeda untuk menguji obrolan secara langsung.
            </div>
        </aside>

        <main class="chat-area">
            <header class="chat-header">
                <h3>Ruang Obrolan Publik</h3>
                <p>Terhubung via Firebase Firestore</p>
            </header>

            <section class="message-area" id="messageArea">
                <div style="text-align: center; color: var(--text-muted); font-size: 13px;">Memuat pesan...</div>
            </section>

            <footer class="chat-input-container">
                <form id="chatForm" onsubmit="kirimPesan(event)">
                    <input type="text" id="msgInput" placeholder="Ketik pesan..." autocomplete="off" required>
                    <button type="submit">Kirim</button>
                </form>
            </footer>
        </main>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp } from "https://gstatic.com";

        // Menggunakan konfigurasi resmi proyek Anda
        const firebaseConfig = {
            apiKey: "AIzaSyC72eYNR9GvRx3gTsa57KqCC9dHb_UKvBU",
            authDomain: "belajarrealtime-b613d.firebaseapp.com",
            projectId: "belajarrealtime-b613d",
            storageBucket: "belajarrealtime-b613d.firebasestorage.app",
            messagingSenderId: "262738286595",
            appId: "1:262738286595:web:e3669a69f7588cffc7d636"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const messageArea = document.getElementById('messageArea');


        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const messageArea = document.getElementById('messageArea');

        window.kirimPesan = async function(event) {
            event.preventDefault();
            const nama = document.getElementById('namaInput').value.trim() || "Anonim";
            const input = document.getElementById('msgInput');
            const teks = input.value.trim();

            if (teks === "") return;

            try {
                await addDoc(collection(db, "messages"), {
                    sender: nama,
                    text: teks,
                    timestamp: serverTimestamp()
                });
                input.value = "";
            } catch (error) {
                alert("Gagal mengirim pesan. Pastikan konfigurasi Firebase sudah benar.");
            }
        };

        const q = query(collection(db, "messages"), orderBy("timestamp", "asc"));
        onSnapshot(q, (snapshot) => {
            messageArea.innerHTML = "";
            if (snapshot.empty) {
                messageArea.innerHTML = '<div style="text-align: center; color: var(--text-muted); font-size: 13px;">Belum ada pesan di ruang ini.</div>';
                return;
            }

            snapshot.forEach((doc) => {
                const data = doc.data();
                const namaUser = document.getElementById('namaInput').value.trim();
                const tipePesan = data.sender === namaUser ? "outgoing" : "incoming";
                
                let waktuFormat = "";
                if (data.timestamp) {
                    waktuFormat = data.timestamp.toDate().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                }

                const msgDiv = document.createElement('div');
                msgDiv.className = `message ${tipePesan}`;
                msgDiv.innerHTML = `
                    <span class="sender-name">${escapeHtml(data.sender)}</span>
                    <div class="bubble">${escapeHtml(data.text)}</div>
                    <span class="time">${waktuFormat}</span>
                `;
                messageArea.appendChild(msgDiv);
            });
            messageArea.scrollTop = messageArea.scrollHeight;
        });

        function escapeHtml(text) {
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return text.replace(/[&<>"']/g, function(m) { return map[m]; });
        }
    </script>
</body>
</html>
